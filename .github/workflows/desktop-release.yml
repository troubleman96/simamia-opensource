name: Desktop releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            artifact: simamia-linux-amd64
          - runner: windows-latest
            platform: windows/amd64
            artifact: simamia-windows-amd64
          - runner: macos-latest
            platform: darwin/universal
            artifact: simamia-macos-universal
    runs-on: ${{ matrix.runner }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            api/go.sum

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Windows C compiler for SQLite
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Wails desktop app
        run: node scripts/desktop.mjs build --platform ${{ matrix.platform }}

      - name: Package Linux app
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C desktop/build/bin simamia-desktop

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path desktop/build/bin/simamia-desktop.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          APP_PATH="$(find desktop/build/bin -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Simamia ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: release-artifacts/*
          body: |
            Simamia desktop builds use Wails and the same Next.js interface as the browser app. Desktop records are stored locally in SQLite and work offline; they do not sync with Camel Accounts or other devices. Browser and Docker distributions remain unchanged.
